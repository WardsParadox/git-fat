name: ci

on:
  push:
    branches: [main, go-rewrite]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: go build -o bin/git-fat ./cmd/git-fat
      - name: Shell tests
        run: |
          export PATH="$PWD/bin:$PATH"
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch master
          mkdir -p "$RUNNER_TEMP/shell" && cd "$RUNNER_TEMP/shell"
          cp "$GITHUB_WORKSPACE"/test.sh "$GITHUB_WORKSPACE"/test-retroactive.sh .
          ./test.sh
          ./test-retroactive.sh
